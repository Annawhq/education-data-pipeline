services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "15432:5432"

    volumes:
      - education_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  init-db:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      METABASE_READER_USER: ${METABASE_READER_USER:?METABASE_READER_USER is required}
      METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD:?METABASE_READER_PASSWORD is required}
    volumes:
      - ./sql:/sql:ro
    command:
      - psql
      - --no-psqlrc
      - --set=ON_ERROR_STOP=1
      - --single-transaction
      - --file=/sql/stg/001_create_stg.sql
      - --file=/sql/dds/001_create_dds.sql
      - --file=/sql/dds/002_processed_raw.sql
      - --file=/sql/cdm/001_create_cdm.sql
      - --file=/sql/cdm/002_metabase_reader.sql
      - --file=/sql/dq/001_create_dq.sql
    restart: "no"


  airflow-db:
    image: postgres:17

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  airflow:
    build:
      context: .

    depends_on:
      init-db:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      airflow-db:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"

      PYTHONPATH: /opt/airflow

      QUIZAPI_KEY: ${QUIZAPI_KEY}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      EXPORT_DIR: /opt/airflow/data/export

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
      - ./data/export:/opt/airflow/data/export

    ports:
      - "8080:8080"

    command: standalone

  metabase-db:
    image: postgres:17
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD is required}
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.64.3.1
    depends_on:
      metabase-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD is required}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:?METABASE_ENCRYPTION_KEY is required}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://localhost:3000/api/health | grep -q '\"status\":\"ok\"'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  metabase-setup:
    image: python:3.12-slim
    depends_on:
      metabase:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/metabase_setup.py:/metabase_setup.py:ro
    environment:
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@example.com}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:?METABASE_ADMIN_PASSWORD is required}
      METABASE_ADMIN_FIRST_NAME: Admin
      METABASE_ADMIN_LAST_NAME: User
      POSTGRES_DB: ${POSTGRES_DB}
      METABASE_READER_USER: ${METABASE_READER_USER:-metabase_reader}
      METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD:?METABASE_READER_PASSWORD is required}
    command:
      - "sh"
      - "-c"
      - "pip install --quiet --disable-pip-version-check requests && python /metabase_setup.py"
    restart: "no"

volumes:
  education_postgres_data:
  airflow_postgres_data:
  airflow_logs:
  metabase_postgres_data:
